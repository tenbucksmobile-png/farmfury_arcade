<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #231F20; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #231F20; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
                 font: 600 16px system-ui, sans-serif; color: #f5c518; pointer-events: none; }
      #bar { width: min(60vw, 320px); height: 12px; border-radius: 6px; background: #4a2c1a; overflow: hidden; }
      #fill { width: 0%; height: 100%; background: #f5c518; transition: width .2s; }
      #rotate { display: none; }
      @media (orientation: portrait) and (max-width: 820px) {
        #rotate { display: flex; position: fixed; inset: auto 0 0 0; justify-content: center; padding: 10px;
                  font: 600 14px system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.6); pointer-events: none; }
      }
    </style>
  </head>
  <body>
    <!-- Embed page for the Farm Fury: Arcade web demo. Meant to sit inside an <iframe> on
         farmfurygames.com/play/. It tells the parent page about loading via postMessage:
         {source:"farmfury-demo", type:"progress", value:0..1}, then type:"ready" or type:"error". -->
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div>Loading Farm Fury...</div><div id="bar"><div id="fill"></div></div></div>
    <div id="rotate">Turn your phone sideways for the best view</div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      function tell(type, value) {
        try { window.parent.postMessage({ source: "farmfury-demo", type: type, value: value }, "*"); } catch (e) {}
      }
      var fill = document.getElementById("fill");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        fill.style.width = (100 * progress) + "%";
        tell("progress", progress);
      }).then(function () {
        document.getElementById("loading").remove();
        document.querySelector("#unity-canvas").focus();
        tell("ready");
      }).catch(function (message) {
        document.getElementById("loading").textContent = "Sorry, the game couldn't start in this browser.";
        tell("error", String(message));
      });
    </script>
  </body>
</html>
